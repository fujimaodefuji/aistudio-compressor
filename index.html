<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Studio Compressor 设置 (v0.4.2)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --input-bg: #f1f5f9;
      --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 20px;
    }

    header {
      margin-bottom: 20px;
      text-align: center;
    }
    header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 6px;
      background: linear-gradient(135deg, #4f46e5, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-sub);
      font-size: 13px;
      margin: 0;
    }

    .notice-banner {
      background: #eef2ff;
      border: 1px solid #c7d2fe;
      color: #3730a3;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .description {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 10px;
      margin-top: -2px;
    }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 13px;
      color: var(--text-main);
      transition: all 0.2s;
    }

    textarea:focus, select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea.code-editor {
      font-family: var(--code-font);
      font-size: 13px;
      line-height: 1.6;
      min-height: 250px;
      background: #fafafa;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }

    .preset-select-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--input-bg);
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      background: var(--input-bg);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .math-explainer {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--text-sub);
      background: rgba(255,255,255,0.7);
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px dashed var(--border);
    }

    .actions-bar {
      position: sticky;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border: 1px solid var(--border);
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: var(--primary);
      color: white;
    }
    button.primary:hover { background: var(--primary-hover); }

    button.secondary {
      background: white;
      border-color: var(--border);
      color: var(--text-main);
    }

    button.danger {
      background: white;
      border-color: #fecaca;
      color: var(--danger);
    }

    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      background: #1e293b;
      color: white;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div class="toast-container">
  <div id="toast" class="toast">设置已保存</div>
</div>

<div class="container">
  <header>
    <h1>AI Studio Compressor 控制台</h1>
    <p>轻松管理记忆快照模板与应答策略 (v0.4.2)</p>
  </header>

  <div id="opener-notice" class="notice-banner">
    💡 <strong>提示：</strong>你当前是直接通过浏览器标签打开的设置页。若要修改并同步至 AI Studio，请在 AI Studio 网页里通过<strong>篡改猴菜单的「打开 Compressor 设置...」</strong>进入。
  </div>

  <form id="compressor-settings-form">
    <div class="card">
      <div class="card-header">
        <span class="card-title">压缩指令模板 (System Prompt)</span>
        <button type="button" class="secondary" id="btn-copy-prompt" style="padding: 4px 10px; font-size:12px;">复制当前 Prompt</button>
      </div>

      <div class="preset-select-bar">
        <label style="margin: 0; white-space: nowrap;">预设模板：</label>
        <select id="preset-select">
          <option value="narrative" selected>📖 互动叙事 / 关系记忆 (Narrative & Roleplay) [默认]</option>
          <option value="coding">💻 代码开发 / 任务重构 (Coding & Task)</option>
          <option value="custom">⚙️ 自定义模式 (Custom)</option>
        </select>
      </div>

      <textarea id="field-prompt" name="compressPrompt" class="code-editor" spellcheck="false"></textarea>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">分支注入与提取设置</span>
      </div>

      <div style="margin-bottom: 14px;">
        <label>快照确认应答 (Ack Message)</label>
        <div class="description">新分支建立时模型的第一句回复。</div>
        <input id="field-ack" name="ackMessage" type="text" />
      </div>

      <div>
        <label>快照提取正则 (Snapshot Regex)</label>
        <div class="description">留空则自动截取整个回复。</div>
        <input id="field-regex" name="snapshotRegex" type="text" placeholder="<state_snapshot>[\s\S]*?</state_snapshot>" />
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span class="card-title">历史保留策略</span>
      </div>
      <div class="memory-grid">
        <div class="math-explainer">
          <span>💡 计算规则：保留字数 = MAX ( 总字数 × 百分比 , 最少保留字数 )</span>
        </div>
        <div>
          <label>保留尾部百分比 (%)</label>
          <input id="field-percent" name="tailPercent" type="number" min="0" max="100" />
        </div>
        <div>
          <label>最少保留字符数 (Chars)</label>
          <input id="field-minchars" name="tailMinChars" type="number" min="0" step="100" />
        </div>
      </div>
    </div>

    <div class="actions-bar">
      <div style="margin-right: auto;">
        <button type="button" class="danger" id="btn-reset">恢复初始默认</button>
      </div>
      <button type="button" class="secondary" id="btn-close">关闭</button>
      <button type="submit" class="primary">保存所有设置</button>
    </div>
  </form>
</div>

<script>
  const PRESETS = {
    coding: `That concludes the above topic. Please remember the chat history and switch roles:

  You are the component that summarizes internal chat history into a given structure.

  When the conversation history grows too large, you will be invoked to distill the entire history into a concise, structured
  XML snapshot. This snapshot is CRITICAL, as it will become the agent's *only* memory of the past. The agent will resume its
  work based solely on this snapshot. All crucial details, plans, errors, and user directives MUST be preserved.

  First, you will think through the entire history in a private <scratchpad>. Review the user's overall goal, the agent's
  actions, tool outputs, file modifications, and any unresolved questions. Identify every piece of information that is essential
  for future actions.

  After your reasoning is complete, generate the final <state_snapshot> XML object. Be incredibly dense with information. Omit
  any irrelevant conversational filler.

  The structure MUST be as follows:

  <state_snapshot>
      <overall_goal>
          [A single, concise sentence describing the user's high-level objective]
      </overall_goal>

      <key_knowledge>
          [Crucial facts, conventions, and constraints the agent must remember based on conversation history]
      </key_knowledge>

      <file_system_state>
          [List files that have been created, read, modified, or deleted]
      </file_system_state>

      <recent_actions>
          [A summary of the last few significant agent actions and their outcomes]
      </recent_actions>

      <current_plan>
          [The agent's step-by-step plan. Mark completed steps]
      </current_plan>
  </state_snapshot>`,

    narrative: `That concludes the current topic. Please remember the conversation history and switch roles:

You are the Narrative & Context State Compressor for an ongoing interactive roleplay and relationship dialogue.
When conversation history grows too large, your task is to distill the dynamic context, emotional tone, physical scene, and unresolved plotlines into a concise, structured XML snapshot: <state_snapshot>.

This snapshot is CRITICAL. It will be injected into the next session as the primary memory bridge to maintain continuous immersion, emotional intimacy, and exact scene continuity.

First, reflect briefly in a private <scratchpad>:
1. Identify the exact current scene, ongoing activity, and physical environment.
2. Review both characters' current physical posture, attire condition, and emotional states.
3. Extract any newly established lore, promises, or milestone changes from the recent conversation.
4. Pinpoint the unfinished interaction or immediate next step.

Then generate ONLY the final <state_snapshot> XML block. Focus strictly on DYNAMIC developments from the recent chat history (do NOT duplicate static character background lore). Be dense, objective, emotionally perceptive, and avoid unnecessary filler.

The structure MUST be strictly as follows:

<state_snapshot>
<scene_and_environment>
[记录压缩前最后一刻所处的具体地理/房间坐标、时间点、周围光线与环境细节]
</scene_and_environment>

<physical_and_attire_state>
[双方当前的姿态距离、身体接触状态、着装状态（衣物款式或解构状态）、生理疲惫/兴奋度与体能状态]
</physical_and_attire_state>

<emotional_dynamics>
[当前的亲密水温、情绪基调、心理防线状态以及本次对话中体现出的依赖/调情/抚慰氛围]
</emotional_dynamics>

<recent_milestones_and_commitments>
[仅记录本次对话中新发生的关键事件、新做出的承诺、新约定或新确立的情感突破（若无新变动填“无”）]
</recent_milestones_and_commitments>

<immediate_next_steps>
[压缩发生瞬间，双方正悬停在哪个对话话题、待完成的身体动作或下一步行动]
</immediate_next_steps>
</state_snapshot>`
  };

  const DEFAULT_SETTINGS = {
    activePreset: "narrative",
    compressPrompt: PRESETS.narrative,
    ackMessage: "（已同步最新状态与记忆快照，随时可以继续。）",
    snapshotRegex: "",
    tailPercent: 30,
    tailMinChars: 2000
  };
  const STORAGE_KEY = "__aistudio_compressor_settings_v1";

  const form = document.getElementById("compressor-settings-form");
  const presetSelect = document.getElementById("preset-select");
  const promptField = document.getElementById("field-prompt");
  const ackField = document.getElementById("field-ack");
  const regexField = document.getElementById("field-regex");
  const percentField = document.getElementById("field-percent");
  const minCharsField = document.getElementById("field-minchars");
  const openerNotice = document.getElementById("opener-notice");
  const toastEl = document.getElementById("toast");

  if (!window.opener) {
    openerNotice.style.display = "block";
  }

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch (err) {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (err) {}
    if (window.opener && !window.opener.closed) {
      window.opener.postMessage({
        source: "aistudio-compressor",
        type: "update-settings",
        payload: settings
      }, "https://aistudio.google.com");
    }
  }

  function populateForm(settings) {
    presetSelect.value = settings.activePreset || "narrative";
    promptField.value = settings.compressPrompt;
    ackField.value = settings.ackMessage || DEFAULT_SETTINGS.ackMessage;
    regexField.value = settings.snapshotRegex || "";
    percentField.value = settings.tailPercent;
    minCharsField.value = settings.tailMinChars;
  }

  presetSelect.addEventListener("change", () => {
    const val = presetSelect.value;
    if (val === "coding") {
      promptField.value = PRESETS.coding;
      ackField.value = "Got it. Thanks for the additional context!";
    } else if (val === "narrative") {
      promptField.value = PRESETS.narrative;
      ackField.value = "（已同步最新状态与记忆快照，随时可以继续。）";
    }
  });

  promptField.addEventListener("input", () => {
    if (presetSelect.value !== "custom") {
      presetSelect.value = "custom";
    }
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    const parsedPercent = Number(percentField.value);
    const normalizedPercent = Number.isFinite(parsedPercent) ? Math.min(Math.max(parsedPercent, 0), 100) : DEFAULT_SETTINGS.tailPercent;
    const parsedMinChars = Number(minCharsField.value);
    const normalizedMinChars = Number.isFinite(parsedMinChars) && parsedMinChars >= 0 ? Math.floor(parsedMinChars) : DEFAULT_SETTINGS.tailMinChars;

    const settings = {
      activePreset: presetSelect.value,
      compressPrompt: promptField.value.trim() || DEFAULT_SETTINGS.compressPrompt,
      ackMessage: ackField.value.trim() || DEFAULT_SETTINGS.ackMessage,
      snapshotRegex: regexField.value.trim(),
      tailPercent: normalizedPercent,
      tailMinChars: normalizedMinChars
    };
    saveSettings(settings);
    showToast("✅ 设置已保存");
  });

  document.getElementById("btn-copy-prompt").addEventListener("click", () => {
    if (!promptField.value) return;
    navigator.clipboard.writeText(promptField.value).then(() => showToast("📋 已复制到剪贴板"));
  });

  document.getElementById("btn-reset").addEventListener("click", () => {
    if (!confirm("确定要恢复默认吗？")) return;
    saveSettings({ ...DEFAULT_SETTINGS });
    populateForm(DEFAULT_SETTINGS);
    showToast("♻️ 已恢复默认配置");
  });

  document.getElementById("btn-close").addEventListener("click", () => window.close());

  window.addEventListener("message", event => {
    if (!event.data || event.data.source !== "aistudio-compressor") return;
    if (event.data.type === "hydrate" && event.data.payload) {
      populateForm({ ...DEFAULT_SETTINGS, ...event.data.payload });
      showToast("📥 已同步 AI Studio 设置");
    }
  });

  populateForm(loadSettings());
</script>
</body>
</html>
