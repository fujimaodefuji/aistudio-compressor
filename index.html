<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>AI Studio Compressor 设置 (v0.4.0)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --surface: #ffffff;
      --bg: #f8fafc;
      --border: #e2e8f0;
      --text-main: #1e293b;
      --text-sub: #64748b;
      --input-bg: #f1f5f9;
      --code-font: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      line-height: 1.5;
      padding-bottom: 40px;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      padding: 30px 20px;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }
    header h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 0 0 8px;
      background: linear-gradient(135deg, #4f46e5, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      color: var(--text-sub);
      font-size: 14px;
      margin: 0;
    }

    .nav-bar {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 16px;
    }
    .github-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      box-shadow: var(--shadow);
      transition: all 0.2s;
    }
    .github-link svg { width: 16px; height: 16px; }
    .github-link:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 22px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title svg { width: 18px; height: 18px; color: var(--text-sub); }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .description {
      font-size: 12px;
      color: var(--text-sub);
      margin-bottom: 10px;
      margin-top: -2px;
    }

    textarea, select, input[type="text"], input[type="number"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      transition: all 0.2s;
      color: var(--text-main);
    }

    textarea:focus, select:focus, input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
    }

    textarea.code-editor {
      font-family: var(--code-font);
      font-size: 13px;
      line-height: 1.6;
      min-height: 240px;
      background: #fafafa;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
    }

    input.code-line {
      font-family: var(--code-font);
      background: #fafafa;
    }

    .preset-select-bar {
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--input-bg);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .preset-select-bar select {
      flex: 1;
      background: white;
      font-weight: 500;
    }

    .memory-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      background: var(--input-bg);
      padding: 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .math-explainer {
      grid-column: 1 / -1;
      font-size: 12px;
      color: var(--text-sub);
      background: rgba(255,255,255,0.7);
      padding: 8px 12px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px dashed var(--border);
    }
    .math-explainer strong { color: var(--primary); }

    .actions-bar {
      position: sticky;
      bottom: 20px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 14px 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border: 1px solid var(--border);
      margin-top: 20px;
    }

    button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 8px;
      border: 1px solid transparent;
      font-weight: 500;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }

    button.primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 5px rgba(79, 70, 229, 0.3);
    }
    button.primary:hover { background: var(--primary-hover); transform: translateY(-1px); }

    button.secondary {
      background: white;
      border-color: var(--border);
      color: var(--text-main);
    }
    button.secondary:hover { background: var(--input-bg); border-color: #cbd5e1; }

    button.danger {
      background: white;
      border-color: #fecaca;
      color: var(--danger);
    }
    button.danger:hover { background: #fef2f2; border-color: #fca5a5; }

    button.small {
      padding: 5px 10px;
      font-size: 12px;
      height: 30px;
    }

    .toast-container {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      pointer-events: none;
    }
    .toast {
      background: #1e293b;
      color: white;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 13px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateY(-20px);
      transition: all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55);
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 600px) {
      .memory-grid { grid-template-columns: 1fr; }
      .actions-bar { flex-direction: column-reverse; bottom: 0; border-radius: 0; }
      .actions-bar button { width: 100%; }
    }
  </style>
</head>
<body>
<div class="toast-container">
  <div id="toast" class="toast">设置已保存</div>
</div>

<div class="container">
  <div class="nav-bar">
    <a class="github-link" href="https://github.com/fujimaodefuji/aistudio-compressor" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 .5C5.73.5.5 5.74.5 12.02c0 5.09 3.29 9.4 7.86 10.93.58.11.8-.25.8-.57 0-.28-.01-1.02-.02-2-3.2.7-3.88-1.55-3.88-1.55-.53-1.36-1.3-1.72-1.3-1.72-1.06-.72.08-.71.08-.71 1.17.08 1.79 1.2 1.79 1.2 1.04 1.79 2.74 1.27 3.41.97.11-.75.41-1.26.74-1.55-2.56-.29-5.26-1.29-5.26-5.73 0-1.27.45-2.32 1.19-3.14-.12-.29-.52-1.45.11-3.01 0 0 .98-.32 3.21 1.2a11.1 11.1 0 0 1 5.84 0c2.23-1.52 3.21-1.2 3.21-1.2.63 1.56.23 2.72.11 3.01.74.82 1.19 1.87 1.19 3.14 0 4.46-2.7 5.44-5.28 5.73.42.36.8 1.08.8 2.19 0 1.58-.01 2.85-.01 3.24 0 .31.21.68.81.57A10.52 10.52 0 0 0 23.5 12C23.5 5.74 18.27.5 12 .5Z"/>
      </svg>
      <span>fujimaodefuji 仓库主页</span>
    </a>
  </div>
  <header>
    <h1>AI Studio Compressor 控制台</h1>
    <p>轻松管理记忆快照模板、AI 应答风格与上下文历史保留策略</p>
  </header>

  <form id="compressor-settings-form">
    <!-- Prompt 模板切换与编辑卡片 -->
    <div class="card">
      <div class="card-header">
                    <span class="card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                        </svg>
                        压缩指令模板 (System Prompt)
                    </span>
        <div style="display:flex; gap:8px;">
          <button type="button" class="secondary small" id="btn-copy-prompt" title="复制当前内容">复制</button>
        </div>
      </div>

      <div class="preset-select-bar">
        <label style="margin: 0; white-space: nowrap;">预设模板：</label>
        <select id="preset-select">
          <option value="coding">💻 代码开发 / 任务重构 (Coding & Task)</option>
          <option value="narrative">📖 互动叙事 / 关系记忆 (Narrative & Roleplay)</option>
          <option value="custom">⚙️ 自定义模式 (Custom)</option>
        </select>
      </div>

      <div class="description">
        这是发送给模型的结构化提炼指令。定义了输出的 XML 快照模块。
      </div>
      <textarea id="field-prompt" name="compressPrompt" class="code-editor" spellcheck="false"></textarea>
    </div>

    <!-- 自定义回复与正则卡片 -->
    <div class="card">
      <div class="card-header">
                    <span class="card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                        </svg>
                        分支注入与提取设置
                    </span>
      </div>

      <div style="margin-bottom: 16px;">
        <label>快照确认应答 (Ack Message)</label>
        <div class="description">
          派生新对话分支时，作为模型接纳快照的第一句应答语（可改成中文或符合角色口吻的话语）。
        </div>
        <input id="field-ack" class="code-line" name="ackMessage" type="text" placeholder="Got it. Thanks for the additional context!" />
      </div>

      <div>
        <label>快照提取正则 (Snapshot Regex)</label>
        <div class="description">
          用于从模型回复中提取指定标签。默认留空即可自动捕获整个回复。
        </div>
        <input id="field-regex" class="code-line" name="snapshotRegex" type="text" placeholder="<state_snapshot>[\s\S]*?</state_snapshot>" />
      </div>
    </div>

    <!-- 历史记录保留策略卡片 -->
    <div class="card">
      <div class="card-header">
                    <span class="card-title">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        历史消息保留策略
                    </span>
      </div>
      <div class="memory-grid">
        <div class="math-explainer">
          <span>💡 计算规则：保留字数 = MAX ( <strong>总字数 × 百分比</strong> , <strong>最少保留字数</strong> )</span>
        </div>
        <div>
          <label>保留尾部百分比 (%)</label>
          <input id="field-percent" name="tailPercent" type="number" min="0" max="100" step="1" />
          <div class="description" style="margin-top:6px; font-size:12px;">建议 20% - 40%</div>
        </div>
        <div>
          <label>最少保留字符数 (Chars)</label>
          <input id="field-minchars" name="tailMinChars" type="number" min="0" step="100" />
          <div class="description" style="margin-top:6px; font-size:12px;">防止短对话丢失上文</div>
        </div>
      </div>
    </div>

    <!-- 底部操作栏 -->
    <div class="actions-bar">
      <div style="margin-right: auto;">
        <button type="button" class="danger" id="btn-reset">恢复初始默认</button>
      </div>
      <button type="button" class="secondary" id="btn-close">关闭</button>
      <button type="submit" class="primary">保存所有设置</button>
    </div>
  </form>
</div>

<script>
  const PRESETS = {
    coding: `That concludes the above topic. Please remember the chat history and switch roles:

  You are the component that summarizes internal chat history into a given structure.

  When the conversation history grows too large, you will be invoked to distill the entire history into a concise, structured
  XML snapshot. This snapshot is CRITICAL, as it will become the agent's *only* memory of the past. The agent will resume its
  work based solely on this snapshot. All crucial details, plans, errors, and user directives MUST be preserved.

  First, you will think through the entire history in a private <scratchpad>. Review the user's overall goal, the agent's
  actions, tool outputs, file modifications, and any unresolved questions. Identify every piece of information that is essential
  for future actions.

  After your reasoning is complete, generate the final <state_snapshot> XML object. Be incredibly dense with information. Omit
  any irrelevant conversational filler.

  The structure MUST be as follows:

  <state_snapshot>
      <overall_goal>
          <!-- A single, concise sentence describing the user's high-level objective. -->
      </overall_goal>

      <key_knowledge>
          <!-- Crucial facts, conventions, and constraints the agent must remember based on the conversation history. -->
      </key_knowledge>

      <file_system_state>
          <!-- List files that have been created, read, modified, or deleted. -->
      </file_system_state>

      <recent_actions>
          <!-- A summary of the last few significant agent actions and their outcomes. -->
      </recent_actions>

      <current_plan>
          <!-- The agent's step-by-step plan. Mark completed steps. -->
      </current_plan>
  </state_snapshot>`,

    narrative: `That concludes the current topic. Please remember the conversation history and switch roles:

You are the Narrative & Context State Compressor for an ongoing interactive roleplay and relationship dialogue.
When conversation history grows too large, your task is to distill the dynamic context, emotional tone, physical scene, and unresolved plotlines into a concise, structured XML snapshot: <state_snapshot>.

This snapshot is CRITICAL. It will be injected into the next session as the primary memory bridge to maintain continuous immersion, emotional intimacy, and exact scene continuity.

First, reflect briefly in a private <scratchpad>:
1. Identify the exact current scene, ongoing activity, and physical environment.
2. Review both characters' current physical posture, attire condition, and emotional states.
3. Extract any newly established lore, promises, or milestone changes from the recent conversation.
4. Pinpoint the unfinished interaction or immediate next step.

Then generate ONLY the final <state_snapshot> XML block. Focus strictly on DYNAMIC developments from the recent chat history (do NOT duplicate static character background lore). Be dense, objective, emotionally perceptive, and avoid unnecessary filler.

The structure MUST be strictly as follows:

<state_snapshot>
<scene_and_environment>
<!-- 记录压缩前最后一刻所处的具体地理/房间坐标、时间点、周围光线与环境细节 -->
</scene_and_environment>

<physical_and_attire_state>
<!-- 双方当前的姿态距离、身体接触状态、着装状态（衣物款式或解构状态）、生理疲惫/兴奋度与体能状态 -->
</physical_and_attire_state>

<emotional_dynamics>
<!-- 当前的亲密水温、情绪基调、心理防线状态以及本次对话中体现出的依赖/调情/抚慰氛围 -->
</emotional_dynamics>

<recent_milestones_and_commitments>
<!-- 仅记录本次对话中新发生的关键事件、新做出的承诺、新约定或新确立的情感突破（无新变动可留空） -->
</recent_milestones_and_commitments>

<immediate_next_steps>
<!-- 压缩发生瞬间，双方正悬停在哪个对话话题、待完成的身体动作或下一步行动 -->
</immediate_next_steps>
</state_snapshot>`
  };

  const DEFAULT_SETTINGS = {
    activePreset: "coding",
    compressPrompt: PRESETS.coding,
    ackMessage: "Got it. Thanks for the additional context!",
    snapshotRegex: "",
    tailPercent: 30,
    tailMinChars: 2000
  };
  const STORAGE_KEY = "__aistudio_compressor_settings_v1";

  const form = document.getElementById("compressor-settings-form");
  const presetSelect = document.getElementById("preset-select");
  const promptField = document.getElementById("field-prompt");
  const ackField = document.getElementById("field-ack");
  const regexField = document.getElementById("field-regex");
  const percentField = document.getElementById("field-percent");
  const minCharsField = document.getElementById("field-minchars");

  const closeBtn = document.getElementById("btn-close");
  const resetBtn = document.getElementById("btn-reset");
  const copyBtn = document.getElementById("btn-copy-prompt");
  const toastEl = document.getElementById("toast");

  function showToast(message) {
    toastEl.textContent = message;
    toastEl.classList.add("show");
    setTimeout(() => toastEl.classList.remove("show"), 2500);
  }

  function loadSettings() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { ...DEFAULT_SETTINGS };
      const parsed = JSON.parse(raw);
      return { ...DEFAULT_SETTINGS, ...parsed };
    } catch (err) {
      return { ...DEFAULT_SETTINGS };
    }
  }

  function saveSettings(settings) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(settings));
    } catch (err) {}
    if (window.opener && !window.opener.closed) {
      // 安全通信目标源指向 AI Studio
      window.opener.postMessage({
        source: "aistudio-compressor",
        type: "update-settings",
        payload: settings
      }, "https://aistudio.google.com");
    }
  }

  function populateForm(settings) {
    presetSelect.value = settings.activePreset || "custom";
    promptField.value = settings.compressPrompt;
    ackField.value = settings.ackMessage || DEFAULT_SETTINGS.ackMessage;
    regexField.value = settings.snapshotRegex || "";
    percentField.value = settings.tailPercent;
    minCharsField.value = settings.tailMinChars;
  }

  // 模板切换事件
  presetSelect.addEventListener("change", () => {
    const val = presetSelect.value;
    if (val === "coding") {
      promptField.value = PRESETS.coding;
      ackField.value = "Got it. Thanks for the additional context!";
    } else if (val === "narrative") {
      promptField.value = PRESETS.narrative;
      ackField.value = "（已同步最新状态与记忆快照，随时可以继续。）";
    }
  });

  promptField.addEventListener("input", () => {
    if (presetSelect.value !== "custom") {
      presetSelect.value = "custom";
    }
  });

  form.addEventListener("submit", event => {
    event.preventDefault();
    const parsedPercent = Number(percentField.value);
    const normalizedPercent = Number.isFinite(parsedPercent) ? Math.min(Math.max(parsedPercent, 0), 100) : DEFAULT_SETTINGS.tailPercent;
    const parsedMinChars = Number(minCharsField.value);
    const normalizedMinChars = Number.isFinite(parsedMinChars) && parsedMinChars >= 0 ? Math.floor(parsedMinChars) : DEFAULT_SETTINGS.tailMinChars;

    const settings = {
      activePreset: presetSelect.value,
      compressPrompt: promptField.value.trim() || DEFAULT_SETTINGS.compressPrompt,
      ackMessage: ackField.value.trim() || DEFAULT_SETTINGS.ackMessage,
      snapshotRegex: regexField.value.trim(),
      tailPercent: normalizedPercent,
      tailMinChars: normalizedMinChars
    };
    saveSettings(settings);
    showToast("✅ 设置已保存并同步");
  });

  copyBtn.addEventListener("click", () => {
    if (!promptField.value) return;
    navigator.clipboard.writeText(promptField.value).then(() => {
      showToast("📋 已复制到剪贴板");
    });
  });

  resetBtn.addEventListener("click", () => {
    if (!confirm("确定要将所有设置恢复为默认值吗？")) return;
    saveSettings({ ...DEFAULT_SETTINGS });
    populateForm(DEFAULT_SETTINGS);
    showToast("♻️ 已恢复默认配置");
  });

  closeBtn.addEventListener("click", () => window.close());

  window.addEventListener("message", event => {
    if (!event.data || event.data.source !== "aistudio-compressor") return;
    if (event.data.type === "hydrate" && event.data.payload) {
      populateForm({ ...DEFAULT_SETTINGS, ...event.data.payload });
      showToast("📥 已同步 AI Studio 设置");
    }
  });

  populateForm(loadSettings());
</script>
</body>
</html>
